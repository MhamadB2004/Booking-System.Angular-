<div class="login-page">
  <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
      <div class="col-lg-5 col-md-7">

        <div class="login-card">
          <div class="login-header text-center">
            <h1 class="sitename">The Property</h1>
            <p>Welcome back! Please sign in to continue</p>
          </div>

          <div *ngIf="error" class="alert-error">
            <i class="bi bi-exclamation-circle"></i>
            {{ error }}
          </div>

          <div *ngIf="showResend" class="resend-box">
            <div class="resend-icon">
              <i class="bi bi-envelope-exclamation"></i>
            </div>
            <p class="resend-text">ما وصلتك رسالة التأكيد؟</p>

            <button
              class="resend-btn"
              (click)="resendVerification()"
              [disabled]="resendLoading || resendCooldown > 0">
              <span *ngIf="resendLoading" class="spinner"></span>
              <span *ngIf="!resendLoading && resendCooldown === 0">إعادة إرسال رابط التأكيد</span>
              <span *ngIf="!resendLoading && resendCooldown > 0">أعد المحاولة بعد {{ resendCooldown }} ثانية</span>
              <span *ngIf="resendLoading">جاري الإرسال...</span>
            </button>

            <p *ngIf="resendMessage" class="resend-success">
              <i class="bi bi-check-circle-fill me-1"></i>{{ resendMessage }}
            </p>
          </div>

          <div class="login-body">
            <div class="form-floating mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Email"
                [(ngModel)]="email">
              <label for="email">
                <i class="bi bi-envelope me-2"></i>Email Address
              </label>
            </div>

            <div class="form-floating mb-2">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Password"
                [(ngModel)]="password">
              <label for="password">
                <i class="bi bi-lock me-2"></i>Password
              </label>
            </div>

            <div class="text-end mb-4">
              <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
            </div>

            <button class="btn-login w-100" (click)="login()">
              <i class="bi bi-box-arrow-in-right me-2"></i>
              Sign In
            </button>

            <div class="login-footer text-center mt-4">
              <p>Don't have an account?
                <a routerLink="/register">Create one now</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="login-bg">
    <div class="overlay"></div>
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600"
      alt="background">
  </div>
</div>
