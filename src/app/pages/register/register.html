<div class="login-page">
  <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
      <div class="col-lg-5 col-md-7">

        <div class="login-card">
          <div class="login-header text-center">
            <h1 class="sitename">TheProperty</h1>
            <p>Create your account to get started</p>
          </div>

          <div class="login-body">
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="fullName"
                placeholder="Full Name" [(ngModel)]="fullName">
              <label for="fullName">
                <i class="bi bi-person me-2"></i>Full Name
              </label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email"
                placeholder="Email" [(ngModel)]="email">
              <label for="email">
                <i class="bi bi-envelope me-2"></i>Email Address
              </label>
            </div>

            <div class="form-floating mb-3">
              <input type="tel" class="form-control" id="phone"
                placeholder="Phone" [(ngModel)]="phone">
              <label for="phone">
                <i class="bi bi-phone me-2"></i>Phone Number
              </label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="password"
                placeholder="Password" [(ngModel)]="password">
              <label for="password">
                <i class="bi bi-lock me-2"></i>Password
              </label>
            </div>

            <div class="role-select mb-4">
              <p class="role-label">I want to:</p>
              <div class="role-options">
                <div class="role-option"
                  [class.active]="role === 'Customer'"
                  (click)="role = 'Customer'">
                  <i class="bi bi-search"></i>
                  <span>Find a Property</span>
                </div>
                <div class="role-option"
                  [class.active]="role === 'Owner'"
                  (click)="role = 'Owner'">
                  <i class="bi bi-house"></i>
                  <span>List a Property</span>
                </div>
              </div>
            </div>

            <button class="btn-login w-100" (click)="register()">
              <i class="bi bi-person-plus me-2"></i>
              Create Account
            </button>

            <div class="login-footer text-center mt-4">
              <p>Already have an account?
                <a routerLink="/login">Sign in here</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="login-bg">
    <div class="overlay"></div>
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600"
      alt="background">
  </div>
</div>
