<div class="login-page">
  <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
      <div class="col-lg-5 col-md-7">

        <div class="login-card">

          <div *ngIf="!submitted">
            <div class="login-header text-center">
              <h1 class="sitename">The Property</h1>
              <p>Enter your email and we'll send you a reset link</p>
            </div>

            <div class="login-body">
              <div class="form-floating mb-4">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="Email"
                  [(ngModel)]="email">
                <label for="email">
                  <i class="bi bi-envelope me-2"></i>Email Address
                </label>
              </div>

              <button class="btn-login w-100" (click)="submit()" [disabled]="loading">
                <i class="bi bi-send me-2" *ngIf="!loading"></i>
                <span *ngIf="!loading">Send Reset Link</span>
                <span *ngIf="loading">Sending...</span>
              </button>

              <div class="login-footer text-center mt-4">
                <p>Remember your password?
                  <a routerLink="/login">Back to Sign In</a>
                </p>
              </div>
            </div>
          </div>

          <div *ngIf="submitted" class="login-body text-center">
            <div class="success-icon mb-3">
              <i class="bi bi-envelope-check"></i>
            </div>
            <h4 class="mb-3">Check Your Email</h4>
            <p class="text-muted">{{ message }}</p>
            <a routerLink="/login" class="btn-login w-100 d-inline-block mt-3">
              Back to Sign In
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div class="login-bg">
    <div class="overlay"></div>
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600"
      alt="background">
  </div>
</div>
