<nav class="navbar navbar-light bg-light px-4">
  <span class="navbar-brand">نظام الحجز</span>
  <button class="btn btn-outline-danger btn-sm" (click)="logout()">
    خروج
  </button>
</nav>

<div class="container mt-4">

  <!-- فلترة -->
  <div class="row g-2 mb-4">
    <div class="col-md-3">
      <select class="form-select" [(ngModel)]="filters.type">
        <option value="">كل الأنواع</option>
        <option value="Farm">مزرعة</option>
        <option value="Apartment">شقة</option>
      </select>
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control"
        placeholder="الموقع" [(ngModel)]="filters.location">
    </div>
    <div class="col-md-2">
      <input type="number" class="form-control"
        placeholder="أقل سعر" [(ngModel)]="filters.minPrice">
    </div>
    <div class="col-md-2">
      <input type="number" class="form-control"
        placeholder="أعلى سعر" [(ngModel)]="filters.maxPrice">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" (click)="search()">
        بحث
      </button>
    </div>
  </div>

  <!-- خطأ -->
  <div *ngIf="error" class="alert alert-warning text-center">
    {{ error }}
  </div>

  <!-- العقارات -->
  <div class="row g-3">
    <div class="col-md-4" *ngFor="let p of properties">
      <div class="card h-100">
        <div class="card-body">
          <span class="badge bg-primary mb-2">
            {{ p.type === 'Farm' ? 'مزرعة' : 'شقة' }}
          </span>
          <h5 class="card-title">{{ p.title }}</h5>
          <p class="text-muted mb-1">{{ p.location }}</p>
          <p class="mb-1">{{ p.pricePerNight }} ريال / ليلة</p>
          <p class="mb-1">أقصى ضيوف: {{ p.maxGuests }}</p>
          <p class="text-warning mb-2">
            ⭐ {{ p.averageRating || 'لا يوجد تقييم' }}
          </p>
        </div>
        <div class="card-footer">
          <button class="btn btn-outline-primary w-100"
            (click)="goToDetails(p.id)">
            عرض التفاصيل
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
