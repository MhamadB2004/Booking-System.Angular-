<app-header></app-header>

<div class="properties-page">
  <div class="container">

    <!-- فلترة -->
    <div class="filter-bar">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label>النوع</label>
          <select class="form-select" [(ngModel)]="filters.type">
            <option value="">الكل</option>
            <option value="Farm">مزرعة</option>
            <option value="apartment">شقة</option>
          </select>
        </div>
        <div class="col-md-3">
          <label>الموقع</label>
          <input type="text" class="form-control"
            placeholder="الموقع..." [(ngModel)]="filters.location">
        </div>
        <div class="col-md-2">
          <label>أقل سعر</label>
          <input type="number" class="form-control"
            placeholder="0" [(ngModel)]="filters.minPrice">
        </div>
        <div class="col-md-2">
          <label>أعلى سعر</label>
          <input type="number" class="form-control"
            placeholder="0" [(ngModel)]="filters.maxPrice">
        </div>
        <div class="col-md-2">
          <button class="btn-search w-100" (click)="search()">
            <i class="bi bi-search"></i> بحث
          </button>
        </div>
      </div>
    </div>

    <!-- تحميل -->
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-accent" role="status"></div>
    </div>

    <!-- خطأ -->
    <div *ngIf="!loading && properties.length === 0" class="no-results">
      <i class="bi bi-house-x"></i>
      <h4>{{ error }}</h4>
      <p>Try adjusting your search filters</p>
    </div>

    <!-- العقارات -->
        <!-- العقارات -->
<div class="featured-properties">
  <div class="row gy-4 mt-4" *ngIf="!loading && properties.length > 0">
    <div class="col-lg-4" *ngFor="let p of properties">
      <article class="stack-card">
        <figure class="stack-media">
            <img [src]="getImageUrl(p.images?.[0]) || 'https://images.unsplash.com/...'"  [alt]="p.title" class="img-fluid" loading="lazy">
          <figcaption>
            <span class="chip" [ngClass]="p.type === 'Farm' ? 'exclusive' : 'new'">
              {{ p.type === 'Farm' ? 'مزرعة' : 'شقة' }}
            </span>
          </figcaption>
        </figure>
        <div class="stack-body">
          <h5>
            <a (click)="goToDetails(p.id)" style="cursor:pointer">
              {{ p.title }}
            </a>
          </h5>
          <div class="stack-loc">
            <i class="bi bi-geo-alt"></i> {{ p.location }}
          </div>
          <ul class="stack-specs">
            <li>
              <i class="bi bi-people"></i> {{ p.maxGuests }} ضيوف
            </li>
            <li>
              <i class="bi bi-star-fill"></i>
              {{ p.averageRating > 0 ? p.averageRating : 'جديد' }}
            </li>
          </ul>
          <div class="stack-foot">
            <span class="stack-price">{{ p.pricePerNight }} ليرة </span>
            <a (click)="goToDetails(p.id)" class="stack-link" style="cursor:pointer">
              التفاصيل
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
    <!-- Pagination -->
    <div class="pagination-wrap" *ngIf="totalPages > 1">
    <button class="page-btn"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)">
        <i class="bi bi-chevron-right"></i>
    </button>

    <button class="page-btn"
        *ngFor="let p of [].constructor(totalPages); let i = index"
        [class.active]="currentPage === i + 1"
        (click)="goToPage(i + 1)">
        {{ i + 1 }}
    </button>

    <button class="page-btn"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)">
        <i class="bi bi-chevron-left"></i>
    </button>
    </div>

  </div>
</div>
