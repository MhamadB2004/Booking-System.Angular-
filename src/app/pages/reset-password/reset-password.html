<div class="login-page">
  <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
      <div class="col-lg-5 col-md-7">

        <div class="login-card">

          <!-- حالة: ما في token بالرابط -->
          <div *ngIf="tokenMissing" class="login-body text-center">
            <div class="error-icon mb-3">
              <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h4 class="mb-3">رابط غير صالح</h4>
            <p class="text-muted">الرابط يلي فتحتو مش صحيح أو ناقص.</p>
            <a routerLink="/forgot-password" class="btn-login w-100 d-inline-block mt-3">
              طلب رابط جديد
            </a>
          </div>

          <!-- حالة: تم التغيير بنجاح -->
          <div *ngIf="success" class="login-body text-center">
            <div class="success-icon mb-3">
              <i class="bi bi-check-circle"></i>
            </div>
            <h4 class="mb-3">تم تغيير كلمة السر بنجاح</h4>
            <p class="text-muted">جاري تحويلك لصفحة تسجيل الدخول...</p>
          </div>

          <!-- حالة: الفورم -->
          <div *ngIf="!tokenMissing && !success">
            <div class="login-header text-center">
              <h1 class="sitename">The Property</h1>
              <p>Choose a new password for your account</p>
            </div>

            <div *ngIf="error" class="alert-error">
              <i class="bi bi-exclamation-circle"></i>
              {{ error }}
            </div>

            <div class="login-body">
              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  id="newPassword"
                  placeholder="New Password"
                  [(ngModel)]="newPassword">
                <label for="newPassword">
                  <i class="bi bi-lock me-2"></i>New Password
                </label>
              </div>

              <div class="form-floating mb-4">
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  placeholder="Confirm Password"
                  [(ngModel)]="confirmPassword">
                <label for="confirmPassword">
                  <i class="bi bi-lock-fill me-2"></i>Confirm Password
                </label>
              </div>

              <button class="btn-login w-100" (click)="submit()" [disabled]="loading">
                <span *ngIf="!loading">Reset Password</span>
                <span *ngIf="loading">Resetting...</span>
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div class="login-bg">
    <div class="overlay"></div>
    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600"
      alt="background">
  </div>
</div>
