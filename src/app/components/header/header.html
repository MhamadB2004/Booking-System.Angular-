<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="header-container container-fluid container-xl position-relative d-flex align-items-center justify-content-between">

    <!-- اللوغو -->
    <a routerLink="/home" class="logo d-flex align-items-center">
      <h1 class="sitename">TheProperty</h1>
    </a>

    <!-- ✅ زر الهامبرغر للموبايل -->
    <button class="mobile-menu-btn" (click)="toggleMenu()" [class.open]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- القائمة -->
    <nav id="navmenu" class="navmenu" [class.mobile-open]="menuOpen">

      <!-- ✅ Overlay للموبايل -->
      <div class="nav-overlay" *ngIf="menuOpen" (click)="toggleMenu()"></div>

      <div class="nav-inner">

        <!-- ✅ هيدر المنيو للموبايل -->
        <div class="nav-mobile-header">
          <span class="sitename">TheProperty</span>
          <button class="nav-close-btn" (click)="toggleMenu()">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>

        <ul>
          <li>
            <a routerLink="/home" routerLinkActive="active"
              (click)="menuOpen = false">
              <i class="bi bi-house-door"></i>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a routerLink="/properties" routerLinkActive="active"
              (click)="menuOpen = false">
              <i class="bi bi-buildings"></i>
              <span>Properties</span>
            </a>
          </li>
          <li>
            <a routerLink="/about" routerLinkActive="active"
              (click)="menuOpen = false">
              <i class="bi bi-info-circle"></i>
              <span>About</span>
            </a>
          </li>

          <ng-container *ngIf="isLoggedIn">
            <li *ngIf="role === 'Customer'">
              <a routerLink="/my-bookings" routerLinkActive="active"
                (click)="menuOpen = false">
                <i class="bi bi-calendar-check"></i>
                <span>حجوزاتي</span>
              </a>
            </li>
            <li *ngIf="role === 'Owner'">
              <a routerLink="/owner" routerLinkActive="active"
                (click)="menuOpen = false">
                <i class="bi bi-house-gear"></i>
                <span>لوحتي</span>
              </a>
            </li>
            <li *ngIf="role === 'Admin'">
              <a routerLink="/admin" routerLinkActive="active"
                (click)="menuOpen = false">
                <i class="bi bi-shield-check"></i>
                <span>الأدمن</span>
              </a>
            </li>

            <!-- زر الإشعارات -->
            <li *ngIf="role === 'Customer'">
              <a routerLink="/notifications" routerLinkActive="active"
                class="notif-btn" (click)="menuOpen = false">
                <i class="bi bi-bell"></i>
                <span>الإشعارات</span>
                <span class="notif-badge" *ngIf="unreadCount > 0">
                  {{ unreadCount }}
                </span>
              </a>
            </li>

            <!-- البروفايل -->
            <li>
              <a routerLink="/profile" routerLinkActive="active"
                (click)="menuOpen = false">
                <i class="bi bi-person-circle"></i>
                <span>Profile</span>
              </a>
            </li>

            <!-- ✅ زر الخروج -->
            <li class="logout-item">
              <a href="#" (click)="logout(); $event.preventDefault()">
                <i class="bi bi-box-arrow-right"></i>
                <span>خروج</span>
              </a>
            </li>
          </ng-container>
        </ul>

        <!-- ✅ Get Started للموبايل -->
        <div class="nav-footer" *ngIf="!isLoggedIn">
          <a routerLink="/login" class="btn-getstarted-mobile"
            (click)="menuOpen = false">
            <i class="bi bi-box-arrow-in-right"></i>
            Get Started
          </a>
        </div>

      </div>
    </nav>

    <!-- ✅ Get Started للديسكتوب -->
    <div class="desktop-actions">
      <a *ngIf="!isLoggedIn" class="btn-getstarted" routerLink="/login">
        Get Started
      </a>
    </div>

  </div>
</header>
